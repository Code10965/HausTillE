name: Tägliche Website-Tests

on:
  schedule:
    # UTC-Zeit! 6:00 UTC = 7:00 bzw. 8:00 deutscher Zeit (je nach Sommer-/Winterzeit).
    - cron: "0 6 * * *"
  workflow_dispatch: # erlaubt zusätzlich manuelles Starten über den "Actions"-Tab

# WICHTIG: Das Test-Setup liegt in einem eigenen Unterordner (website-tests/),
# getrennt vom eigentlichen Website-Projekt im Repo-Root. Ohne diese Zeile
# würden npm/playwright im Repo-Root laufen und dort das FALSCHE
# package.json (das der Website, nicht das der Tests) finden.
defaults:
  run:
    working-directory: website-tests

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium webkit

      - name: Tests ausführen
        env:
          # Trage deine echte Domain als Repository-Secret "BASE_URL" ein
          # (Settings -> Secrets and variables -> Actions -> New repository secret)
          BASE_URL: ${{ secrets.BASE_URL }}
        run: npx playwright test

      - name: Testbericht hochladen (auch bei Fehlern)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website-tests/playwright-report/
          retention-days: 14