name: Deploy Eleventy site to Manitu

# Läuft bei jedem Push auf main automatisch, außerdem manuell startbar
# über den "Run workflow"-Button im Actions-Tab (workflow_dispatch).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build
        # Kein ELEVENTY_PATH_PREFIX mehr nötig: die Seite liegt jetzt im
        # Root der eigenen Domain, nicht mehr in einem GitHub-Pages-
        # Unterordner. eleventy.config.js fällt dann automatisch auf "/"
        # zurück (siehe pathPrefix: process.env.ELEVENTY_PATH_PREFIX || "/").

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Per SFTP (lftp) zu Manitu hochladen
        # Dritter Anlauf für den Deploy-Mechanismus: FTPS (SamKirkland)
        # produzierte wiederholt Timeouts beim Ersetzen bestehender
        # Dateien, die reine SFTP-Action (wangyucode) blieb zweimal
        # ohne jede Fehlermeldung einfach hängen (unbegrenzt lange, kein
        # Fortschritt). lftp ist ein sehr ausgereiftes, seit Jahrzehnten
        # für genau solche automatisierten Uploads genutztes Tool -
        # spricht ebenfalls reines SFTP (kein Shell-Zugriff auf dem
        # Server nötig), aber mit expliziten Timeout-/Retry-
        # Einstellungen, die ein stilles Hängenbleiben verhindern.
        # "mirror --only-newer" lädt zudem nur tatsächlich geänderte
        # Dateien hoch statt jedes Mal alle 254.
        run: |
          lftp -u "${{ secrets.MANITU_FTP_USERNAME }},${{ secrets.MANITU_FTP_PASSWORD }}" -p 23 sftp://${{ secrets.MANITU_FTP_HOST }} <<'ENDSCRIPT'
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 3
          mirror --reverse --verbose --only-newer _site /web/haus-till-e.com/
          bye
          ENDSCRIPT