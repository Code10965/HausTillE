name: Deploy Eleventy site to Manitu

# Läuft bei jedem Push auf main automatisch, außerdem manuell startbar
# über den "Run workflow"-Button im Actions-Tab (workflow_dispatch).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build
        # Kein ELEVENTY_PATH_PREFIX mehr nötig: die Seite liegt jetzt im
        # Root der eigenen Domain, nicht mehr in einem GitHub-Pages-
        # Unterordner. eleventy.config.js fällt dann automatisch auf "/"
        # zurück (siehe pathPrefix: process.env.ELEVENTY_PATH_PREFIX || "/").

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Per SFTP (lftp) zu Manitu hochladen
        # WICHTIG: KEIN "--only-newer" mehr! Das verglich Dateien anhand
        # ihres Änderungsdatums (mtime) - bei jedem CI-Lauf wird das
        # Repository frisch ausgecheckt, alle lokalen Dateien bekommen
        # dadurch zwar ein neues Datum, aber falls die Uhr des
        # GitHub-Runners und die des Manitu-Servers nicht exakt synchron
        # laufen (auch nur Sekundenbruchteile Unterschied reichen),
        # kann lftp fälschlich entscheiden, eine inhaltlich geänderte
        # Datei sei "nicht neuer" und den Upload überspringen - genau
        # das ist uns bei einer reinen Text-/JSON-Änderung passiert
        # (Build lokal korrekt, Server blieb auf altem Stand). Ohne
        # "--only-newer" vergleicht mirror stattdessen nach Dateigröße,
        # was unabhängig von Uhrzeiten zuverlässig echte inhaltliche
        # Änderungen erkennt.
        run: |
          lftp -u "${{ secrets.MANITU_FTP_USERNAME }},${{ secrets.MANITU_FTP_PASSWORD }}" -p 23 sftp://${{ secrets.MANITU_FTP_HOST }} <<'ENDSCRIPT'
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 3
          mirror --reverse --verbose _site /web/haus-till-e.com/
          bye
          ENDSCRIPT