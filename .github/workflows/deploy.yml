name: Deploy Eleventy site to Manitu

# Läuft bei jedem Push auf main automatisch, außerdem manuell startbar
# über den "Run workflow"-Button im Actions-Tab (workflow_dispatch).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build
        # Kein ELEVENTY_PATH_PREFIX mehr nötig: die Seite liegt jetzt im
        # Root der eigenen Domain, nicht mehr in einem GitHub-Pages-
        # Unterordner. eleventy.config.js fällt dann automatisch auf "/"
        # zurück (siehe pathPrefix: process.env.ELEVENTY_PATH_PREFIX || "/").

      - name: Per SFTP zu Manitu hochladen
        uses: wangyucode/sftp-upload-action@v2.0.4
        with:
          server: ${{ secrets.MANITU_FTP_HOST }}
          username: ${{ secrets.MANITU_FTP_USERNAME }}
          password: ${{ secrets.MANITU_FTP_PASSWORD }}
          port: 23
          localDir: "_site"
          remoteDir: "/web/haus-till-e.com/"