name: Deploy Eleventy site to Manitu

# Läuft bei jedem Push auf main automatisch, außerdem manuell startbar
# über den "Run workflow"-Button im Actions-Tab (workflow_dispatch).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: lftp-Skript schreiben
        # WICHTIG: "--ignore-time" reichte NICHT zuverlässig aus - bei
        # einer Datumsänderung mit GLEICHER Zeichenanzahl ("20." ->
        # "19.") blieb die Dateigröße identisch, und ein kompletter
        # Deploy-Lauf hat daraufhin buchstäblich GAR NICHTS übertragen
        # (leeres Transfer-Log, obwohl der Workflow grün war). Das ist
        # jetzt der zweite bestätigte Fall dieser Art (erster Fall:
        # "Fets"->"Fest" hatte wenigstens eine andere Größe und wurde
        # noch erkannt). Robusteste Lösung: den Größen-/Zeit-Vergleich
        # komplett abschalten und stattdessen JEDES Mal bedingungslos
        # ALLES hochladen ("--newer-than=@0" erzwingt das explizit,
        # unabhängig von Größe/Zeit/Cache). Bei der überschaubaren
        # Projektgröße kostet das nur ein bis zwei Minuten mehr pro
        # Deploy, garantiert dafür aber echte Zuverlässigkeit.
        run: |
          cat > /tmp/deploy.lftp << 'LFTPSCRIPT'
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 3
          set xfer:log yes
          set xfer:log-file /tmp/lftp-transfer.log
          open -u "${{ secrets.MANITU_FTP_USERNAME }},${{ secrets.MANITU_FTP_PASSWORD }}" -p 23 sftp://${{ secrets.MANITU_FTP_HOST }}
          lcd _site
          cd /web/haus-till-e.com/
          mirror --reverse --verbose --no-perms --newer-than=@0
          bye
          LFTPSCRIPT

      - name: Per SFTP (lftp) zu Manitu hochladen
        run: |
          lftp -f /tmp/deploy.lftp
          echo "--- lftp beendet mit Exit-Code $? ---"
          echo "--- Transfer-Log (falls vorhanden) ---"
          cat /tmp/lftp-transfer.log 2>/dev/null || echo "(keine Transfer-Log-Datei gefunden)"