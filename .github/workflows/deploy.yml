name: Deploy Eleventy site to Manitu

# Läuft bei jedem Push auf main automatisch, außerdem manuell startbar
# über den "Run workflow"-Button im Actions-Tab (workflow_dispatch).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build
        # Kein ELEVENTY_PATH_PREFIX mehr nötig: die Seite liegt jetzt im
        # Root der eigenen Domain, nicht mehr in einem GitHub-Pages-
        # Unterordner. eleventy.config.js fällt dann automatisch auf "/"
        # zurück (siehe pathPrefix: process.env.ELEVENTY_PATH_PREFIX || "/").

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: lftp-Skript schreiben
        run: |
          cat > /tmp/deploy.lftp << 'LFTPSCRIPT'
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 3
          set xfer:log yes
          set xfer:log-file /tmp/lftp-transfer.log
          open -u "${{ secrets.MANITU_FTP_USERNAME }},${{ secrets.MANITU_FTP_PASSWORD }}" -p 23 sftp://${{ secrets.MANITU_FTP_HOST }}
          lcd _site
          cd /web/haus-till-e.com/
          mirror --reverse --verbose --ignore-time
          bye
          LFTPSCRIPT
        # WICHTIG - Ursache des "_site"-Verschachtelungs-Bugs: Wenn
        # mirror sowohl Quell- als auch Zielpfad als Argumente bekommt
        # ("mirror _site /web/haus-till-e.com/"), hat lftp bei einem
        # Teil-Update (nur eine geänderte Datei von 254) den lokalen
        # Ordnernamen "_site" fälschlich als NEUEN Unterordner im Ziel
        # angelegt (Ergebnis: /web/haus-till-e.com/_site/de/... statt
        # /web/haus-till-e.com/de/...) - die eigentliche Zieldatei blieb
        # dadurch unverändert. Der eindeutigste, unmissverständlichste
        # lftp-Modus ist stattdessen: mit "lcd"/"cd" explizit in beide
        # Verzeichnisse wechseln und "mirror" komplett OHNE Pfad-
        # Argumente aufrufen - dann spiegelt es "aktueller lokaler
        # Ordner" -> "aktueller Remote-Ordner", ohne Verschachtelungs-
        # Mehrdeutigkeit.

      - name: Per SFTP (lftp) zu Manitu hochladen
        run: |
          lftp -f /tmp/deploy.lftp
          echo "--- lftp beendet mit Exit-Code $? ---"
          echo "--- Transfer-Log (falls vorhanden) ---"
          cat /tmp/lftp-transfer.log 2>/dev/null || echo "(keine Transfer-Log-Datei gefunden)"