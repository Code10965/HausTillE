name: Deploy Eleventy site to GitHub Pages

# Läuft bei jedem Push auf main automatisch, außerdem manuell startbar
# über den "Run workflow"-Button im Actions-Tab (workflow_dispatch).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Diese drei Rechte braucht der Workflow: das Repo lesen, auf Pages
# schreiben, sich per OIDC-Token gegenüber Pages authentifizieren.
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass zwei Deploys gleichzeitig laufen (z.B. bei zwei
# schnell aufeinanderfolgenden Pushes) - der zweite wartet, statt den
# ersten mitten im Deploy zu unterbrechen.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build-Ergebnis (_site) als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
